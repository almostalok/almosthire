<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="p-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="node-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="total-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
  </defs>

  <rect width="1200" height="340" rx="16" fill="url(#p-bg)" stroke="#27272a" />

  <!-- Section Header -->
  <text x="40" y="44" fill="#f4f4f5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800">
    5-STAGE DETERMINISTIC MERIT PIPELINE &amp; STAGE-GATE SPECIFICATIONS
  </text>
  <text x="40" y="66" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
    Every threshold is public prior to application. Zero ambiguous committee deliberations. Guaranteed SLA turnaround.
  </text>

  <!-- Connecting Pipeline Spine -->
  <line x1="120" y1="160" x2="1080" y2="160" stroke="#27272a" stroke-width="4" stroke-dasharray="6 6" />

  <!-- Stage 1 -->
  <g transform="translate(40, 100)">
    <rect width="170" height="180" rx="12" fill="url(#node-grad)" stroke="#3f3f46" stroke-width="1" />
    <circle cx="28" cy="28" r="14" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" />
    <text x="24" y="32" fill="#d8b4fe" font-family="monospace" font-size="11" font-weight="700">01</text>
    <rect x="52" y="18" width="90" height="20" rx="6" fill="#a855f7" fill-opacity="0.15" />
    <text x="62" y="32" fill="#c084fc" font-family="monospace" font-size="10" font-weight="700">BLIND REVIEW</text>
    <text x="16" y="66" fill="#f4f4f5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Proof-of-Work</text>
    <text x="16" y="82" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Profile Audit</text>
    <line x1="16" y1="96" x2="154" y2="96" stroke="#27272a" />
    <text x="16" y="116" fill="#71717a" font-family="monospace" font-size="11">Weight: <tspan fill="#e4e4e7" font-weight="700">10%</tspan></text>
    <text x="16" y="134" fill="#71717a" font-family="monospace" font-size="11">Max: <tspan fill="#34d399" font-weight="700">100 pts</tspan></text>
    <text x="16" y="152" fill="#71717a" font-family="monospace" font-size="11">Cutoff: <tspan fill="#fbbf24" font-weight="700">65 pts</tspan></text>
    <text x="16" y="170" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="600">SLA: 48 Hours</text>
  </g>

  <!-- Stage 2 -->
  <g transform="translate(230, 100)">
    <rect width="170" height="180" rx="12" fill="url(#node-grad)" stroke="#3f3f46" stroke-width="1" />
    <circle cx="28" cy="28" r="14" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" />
    <text x="24" y="32" fill="#d8b4fe" font-family="monospace" font-size="11" font-weight="700">02</text>
    <rect x="52" y="18" width="90" height="20" rx="6" fill="#a855f7" fill-opacity="0.15" />
    <text x="62" y="32" fill="#c084fc" font-family="monospace" font-size="10" font-weight="700">BLIND CODE</text>
    <text x="16" y="66" fill="#f4f4f5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Blind Practical</text>
    <text x="16" y="82" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Assessment</text>
    <line x1="16" y1="96" x2="154" y2="96" stroke="#27272a" />
    <text x="16" y="116" fill="#71717a" font-family="monospace" font-size="11">Weight: <tspan fill="#e4e4e7" font-weight="700">25%</tspan></text>
    <text x="16" y="134" fill="#71717a" font-family="monospace" font-size="11">Max: <tspan fill="#34d399" font-weight="700">250 pts</tspan></text>
    <text x="16" y="152" fill="#71717a" font-family="monospace" font-size="11">Cutoff: <tspan fill="#fbbf24" font-weight="700">175 pts</tspan></text>
    <text x="16" y="170" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="600">SLA: 72 Hours</text>
  </g>

  <!-- Stage 3 -->
  <g transform="translate(420, 100)">
    <rect width="170" height="180" rx="12" fill="url(#node-grad)" stroke="#3f3f46" stroke-width="1" />
    <circle cx="28" cy="28" r="14" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" />
    <text x="24" y="32" fill="#67e8f9" font-family="monospace" font-size="11" font-weight="700">03</text>
    <text x="16" y="66" fill="#f4f4f5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Core Domain</text>
    <text x="16" y="82" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Deep-Dive</text>
    <line x1="16" y1="96" x2="154" y2="96" stroke="#27272a" />
    <text x="16" y="116" fill="#71717a" font-family="monospace" font-size="11">Weight: <tspan fill="#e4e4e7" font-weight="700">30%</tspan></text>
    <text x="16" y="134" fill="#71717a" font-family="monospace" font-size="11">Max: <tspan fill="#34d399" font-weight="700">300 pts</tspan></text>
    <text x="16" y="152" fill="#71717a" font-family="monospace" font-size="11">Cutoff: <tspan fill="#fbbf24" font-weight="700">210 pts</tspan></text>
    <text x="16" y="170" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="600">SLA: 48 Hours</text>
  </g>

  <!-- Stage 4 -->
  <g transform="translate(610, 100)">
    <rect width="170" height="180" rx="12" fill="url(#node-grad)" stroke="#3f3f46" stroke-width="1" />
    <circle cx="28" cy="28" r="14" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" />
    <text x="24" y="32" fill="#67e8f9" font-family="monospace" font-size="11" font-weight="700">04</text>
    <text x="16" y="66" fill="#f4f4f5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">System Design</text>
    <text x="16" y="82" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Applied Case</text>
    <line x1="16" y1="96" x2="154" y2="96" stroke="#27272a" />
    <text x="16" y="116" fill="#71717a" font-family="monospace" font-size="11">Weight: <tspan fill="#e4e4e7" font-weight="700">20%</tspan></text>
    <text x="16" y="134" fill="#71717a" font-family="monospace" font-size="11">Max: <tspan fill="#34d399" font-weight="700">200 pts</tspan></text>
    <text x="16" y="152" fill="#71717a" font-family="monospace" font-size="11">Cutoff: <tspan fill="#fbbf24" font-weight="700">140 pts</tspan></text>
    <text x="16" y="170" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="600">SLA: 48 Hours</text>
  </g>

  <!-- Stage 5 -->
  <g transform="translate(800, 100)">
    <rect width="170" height="180" rx="12" fill="url(#node-grad)" stroke="#3f3f46" stroke-width="1" />
    <circle cx="28" cy="28" r="14" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" />
    <text x="24" y="32" fill="#fcd34d" font-family="monospace" font-size="11" font-weight="700">05</text>
    <text x="16" y="66" fill="#f4f4f5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Bar-Raiser &amp;</text>
    <text x="16" y="82" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Culture-Add</text>
    <line x1="16" y1="96" x2="154" y2="96" stroke="#27272a" />
    <text x="16" y="116" fill="#71717a" font-family="monospace" font-size="11">Weight: <tspan fill="#e4e4e7" font-weight="700">15%</tspan></text>
    <text x="16" y="134" fill="#71717a" font-family="monospace" font-size="11">Max: <tspan fill="#34d399" font-weight="700">150 pts</tspan></text>
    <text x="16" y="152" fill="#71717a" font-family="monospace" font-size="11">Cutoff: <tspan fill="#fbbf24" font-weight="700">105 pts</tspan></text>
    <text x="16" y="170" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="600">SLA: 24 Hours</text>
  </g>

  <!-- Total Final Box -->
  <g transform="translate(990, 100)">
    <rect width="170" height="180" rx="12" fill="url(#total-grad)" stroke="#059669" stroke-width="1.5" />
    <circle cx="28" cy="28" r="14" fill="#10b981" fill-opacity="0.2" stroke="#10b981" />
    <text x="22" y="32" fill="#6ee7b7" font-family="monospace" font-size="10" font-weight="700">FINAL</text>
    <text x="16" y="66" fill="#ecfdf5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800">Composite</text>
    <text x="16" y="82" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Merit Score</text>
    <line x1="16" y1="96" x2="154" y2="96" stroke="#065f46" />
    <text x="16" y="116" fill="#a7f3d0" font-family="monospace" font-size="11">Weight: <tspan fill="#ffffff" font-weight="800">100%</tspan></text>
    <text x="16" y="134" fill="#a7f3d0" font-family="monospace" font-size="11">Max: <tspan fill="#34d399" font-weight="800">1,000 pts</tspan></text>
    <text x="16" y="152" fill="#a7f3d0" font-family="monospace" font-size="11">Cutoff: <tspan fill="#fbbf24" font-weight="800">695 pts</tspan></text>
    <text x="16" y="170" fill="#67e8f9" font-family="monospace" font-size="10" font-weight="700">10-Day SLA Max</text>
  </g>
</svg>
